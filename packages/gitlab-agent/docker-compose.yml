services:
  gitlab-opencode-agent:
    build:
      context: .
      dockerfile: Dockerfile.release
      args:
        OPENCODE_VERSION: ""
    container_name: gitlab-opencode-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - opencode-workspaces:/tmp/opencode-workspaces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opencode-workspaces:
